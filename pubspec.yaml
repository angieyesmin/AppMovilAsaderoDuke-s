
name: app_asadero_dukes
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencias del proyecto
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  http: ^1.6.0

# Prueba temporal para evitar el error de compilación de JNI
dependency_overrides:
  shared_preferences_android: 2.4.18

# Dependencias de desarrollo
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Configuración de Flutter
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/images/
